name: ROM-to-suit maxcut temporary verification

on:
  push:
    branches:
      - maxcut-rom-suit-closure
    paths:
      - 'src/smii/seams/c3_transport_measurement.py'
      - 'src/smii/seams/suit_closure_receipt.py'
      - 'src/smii/seams/__init__.py'
      - 'src/smii/orchestrator/suit_closure_dag.py'
      - 'src/smii/orchestrator/__init__.py'
      - 'scripts/emit_suit_closure_receipts.py'
      - 'tests/smii/seams/test_c3_transport_measurement.py'
      - 'tests/smii/seams/test_suit_closure_receipt.py'
      - 'tests/smii/orchestrator/test_suit_closure_dag.py'
      - '.github/workflows/maxcut-rom-suit-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,dev,tools]'
      - name: Ruff changed surfaces
        run: |
          python -m ruff check \
            src/smii/seams/c3_transport_measurement.py \
            src/smii/seams/suit_closure_receipt.py \
            src/smii/seams/__init__.py \
            src/smii/orchestrator/suit_closure_dag.py \
            src/smii/orchestrator/__init__.py \
            scripts/emit_suit_closure_receipts.py \
            tests/smii/seams/test_c3_transport_measurement.py \
            tests/smii/seams/test_suit_closure_receipt.py \
            tests/smii/orchestrator/test_suit_closure_dag.py
      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/smii/seams/test_c3_transport_measurement.py \
            tests/smii/seams/test_suit_closure_receipt.py \
            tests/smii/orchestrator/test_suit_closure_dag.py
      - name: Full suite
        run: python -m pytest -q
