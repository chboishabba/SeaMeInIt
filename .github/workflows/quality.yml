name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev,tools]"

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          python -m ruff check . > ruff.txt 2>&1
          status=$?
          cat ruff.txt
          exit "$status"

      - name: Pytest
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest > pytest.txt 2>&1
          status=$?
          cat pytest.txt
          exit "$status"

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: |
            ruff.txt
            pytest.txt
          if-no-files-found: error

      - name: Enforce quality gate
        if: steps.ruff.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: exit 1
