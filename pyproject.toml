[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seameinit"
version = "0.1.0"
description = "SeaMeInIt avatar modelling utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SeaMeInIt", email = "engineering@seameinit.local"}]
dependencies = [
    "numpy>=1.24",
    "smplx>=0.1.28",
]

[project.optional-dependencies]
test = [
    "hypothesis>=6.100",
    "jsonschema>=4.0",
    "Pillow>=9.0",
    "pillow-avif-plugin>=1.5.5",
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pyyaml>=6.0",
]
dev = [
    "mypy>=1.8",
    "ruff>=0.5",
]
tools = [
    "requests>=2.31.0",
    "trimesh>=4.9.0",
]
vision = [
    "mediapipe>=0.10",
    "Pillow>=9.0",
    "pillow-avif-plugin>=1.5.5",
]

dynamic = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
extend-exclude = ["delme.py"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "GarmentCode",
  "Garment-Pattern-Estimation",
  "outputs",
  "assets",
  ".git",
  ".venv",
]
addopts = "-ra"
